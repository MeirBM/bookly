# Render Blueprint. Postgres is Neon (external) and Redis is Render Key Value.
services:
  - type: web
    name: bookly-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      # Neon connection string (direct, not the -pooler host: Flyway takes an advisory lock).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bookly-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      # Origin of the Vercel frontend, e.g. https://bookly.vercel.app (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Render's proxy sets X-Forwarded-For; the rate limiter keys on the client address.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      - key: EXPOSE_API_DOCS
        value: "false"
      # The free instance has 512 MB; keep the heap well inside it.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC

  - type: keyvalue
    name: bookly-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
