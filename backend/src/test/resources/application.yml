# Test profile. Testcontainers supplies datasource and redis properties at runtime.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

bookly:
  jwt:
    secret: test-only-secret-not-used-anywhere-else-0123456789abcdef  # allow-secret: test fixture
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    issuer: bookly
  security:
    expose-api-docs: true
    rate-limit:
      # Effectively off: these suites drive many requests from one address, and a limit tripping
      # mid-suite would produce failures that look like defects in the code under test.
      max-requests: 100000
      api-max-requests: 100000
      public-max-requests: 100000
      window: PT1M
    # BCrypt is deliberately slow; hashing once per test would dominate the suite.
    # Turn-1 spec, pitfall 8. This value must never reach a non-test profile.
    bcrypt-strength: 4
