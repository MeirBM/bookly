spring:
  application:
    name: bookly-backend

  datasource:
    # No defaults, for the same reason bookly.jwt.secret has none: a deployment that forgets
    # DATABASE_PASSWORD should fail loudly at startup, not quietly connect to whatever database
    # answers on localhost with the development credentials and then serve traffic from it.
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false            # an entity must not be lazily loaded from a view layer
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; a mismatch must fail at startup
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null

server:
  # Only enable behind a proxy that sets X-Forwarded-For itself. Without it, getRemoteAddr()
  # returns the load balancer's address, so every visitor on the internet shares one rate-limit
  # bucket and a single shell loop takes the booking page down for everyone. Enabled with it and
  # no trusted proxy in front, a caller can spoof the header and get an unlimited allowance -
  # which is why it is off by default and set explicitly in the deployment.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Railway and most platforms assign the port at runtime. Binding to a fixed 8080 makes the
  # container look unhealthy and get restarted, which reads as a slow deploy rather than a
  # misconfiguration - turn-3 spec, pitfall 9.
  port: ${PORT:8080}
  error:
    include-message: never         # error bodies are built by the advice, not by Spring's default
    include-stacktrace: never
    include-binding-errors: never

bookly:
  cors:
    # Explicit origins, never a wildcard: the frontend and the API are separate services, so
    # this is required for the product to work at all, and "*" would let any site script it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Every row here makes an availability computation more expensive, so unbounded writes are
  # a way to make every later read slower for everyone. Generous for a real business,
  # nowhere near enough to be a denial-of-service primitive.
  booking:
    # How far ahead a booking may be made. Unbounded in either direction, an anonymous caller
    # could write appointments into the past or into 2099, and booking out every slot of every
    # year became a matter of patience rather than a matter of getting past a control.
    horizon-days: 120

  limits:
    services-per-business: 200
    employees-per-business: 200
    working-hours-per-employee: 100
    blocked-times-per-business: 2000

  jwt:
    # No default. The application must refuse to start rather than run on a known key.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    # Was 30 days. Both tokens sit under one localStorage key, so a single script read yields
    # both and the 15-minute access lifetime bounded nothing an attacker gained. Seven days is
    # proportionate to a business owner's working week.
    refresh-token-ttl: P7D
    issuer: bookly

  security:
    rate-limit:
      # Tight and address-keyed: /api/auth is unauthenticated, and this is what stops
      # credential stuffing.
      max-requests: 20
      # Looser and principal-keyed: the rest of the API is authenticated, and the risk there
      # is an account creating unbounded rows or driving an expensive read in a loop.
      api-max-requests: 300
      # The public booking surface: unauthenticated, and the only place an anonymous caller can
      # write. Metered by address, more tightly than the authenticated API.
      public-max-requests: 60
      window: PT1M
    # The document is a complete map of the API surface. Criterion 1.16 requires it to exist and
    # be complete; it does not require it to be public. On for local development, off by default
    # so a deployment does not publish it by omission.
    expose-api-docs: ${EXPOSE_API_DOCS:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
